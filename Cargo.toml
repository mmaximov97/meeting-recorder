[package]
name = "meeting-recorder"
version = "0.1.0"
edition = "2021"

# src-tauri лежит внутри каталога корневого пакета, поэтому его надо объявить
# членом воркспейса: иначе cargo из src-tauri находит этот манифест, не видит
# себя в нём и падает с «current package believes it's in a workspace when it's
# not». Побочный плюс — общий target/ и одна сборка зависимостей на оба крейта.
[workspace]
members = ["src-tauri"]
# Без этого `cargo test` в корне прогоняет только ядро: корневой пакет — сам себе
# и член воркспейса, и его корень, а cargo по умолчанию берёт именно текущий
# пакет. Тесты GUI-крейта тогда существуют, но не запускаются никем — то есть
# ровно тот способ, которым проводка и остаётся непокрытой.
default-members = [".", "src-tauri"]

# Ядро выставлено библиотекой ради Tauri-крейта в src-tauri/: ему нужны те же
# App/WindowsDetector/poll_to_event, что и консоли.
[lib]
name = "meeting_recorder"
path = "src/lib.rs"

# Консольный бинарь остаётся и после появления GUI: это единственный способ
# прогнать ядро без webview, то есть отладить детект и запись.
[[bin]]
name = "meeting-recorder-cli"
path = "src/main.rs"

[dependencies]
sysinfo = "0.32"
thiserror = "2"
hound = "3.5"
chrono = "0.4"
# Только фасад: ядро зовёт log::error!/warn!, а какой бэкенд их слушает —
# решает потребитель (GUI — tauri-plugin-log в файл, CLI — env_logger в
# stderr). Раньше на месте этих вызовов был eprintln! прямо в захвате, и в
# GUI, у которого нет консоли, причина сбоя терялась безвозвратно.
log = "0.4"
# Бэкенд для консольного бинаря — он и так печатает в терминал, но без
# инициализации `log::error!`/`log::warn!` из ядра молча проглатываются:
# у фасада нет реализации, пока её не назначили через `env_logger::init()`.
env_logger = "0.11"
# 0.18, а не 0.15 из плана: у 0.15 другой API (россыпь отдельных типов ошибок,
# StreamConfig по ссылке, SampleRate-newtype), а loopback на WASAPI подтверждён
# прямо в исходниках 0.18 — см. комментарий в src/capture/mod.rs.
# Тянет свою версию windows (>=0.61) рядом с нашей 0.58: дубликат в дереве
# осознанный, версии semver-несовместимы и мирно сосуществуют.
cpal = "0.18"

# Запись экрана на Windows (src/screen/windows.rs): Windows Graphics Capture и
# кодировщик Media Foundation в mp4. Тянет свою windows 0.62 рядом с нашей 0.58 —
# так же осознанно, как cpal.
[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
]

# Core Audio Process Tap (macOS 14.4+). Проверено по исходникам крейта: голых
# extern "C" объявлений не нужно вообще — objc2-core-audio 0.3 покрывает и класс
# CATapDescription, и все семь функций рецепта (AudioHardwareCreate/DestroyProcessTap,
# AudioHardwareCreate/DestroyAggregateDevice, AudioDeviceCreateIOProcIDWithBlock,
# AudioDeviceStart/Stop/DestroyIOProcID), и ключи словаря агрегата.
# Остальные четыре крейта — обязательная обвязка, а не удобство: objc2 даёт alloc/Retained
# для CATapDescription, objc2-foundation — NSArray/NSDictionary/NSString/NSNumber/NSUUID
# для словаря агрегата, block2 — блок IOProc, dispatch2 — очередь под него (не-nil
# обязательна), objc2-core-audio-types — AudioBufferList/AudioStreamBasicDescription,
# objc2-core-foundation — CFDictionary в сигнатуре AudioHardwareCreateAggregateDevice.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
# Запись экрана (src/screen/macos.rs): SCStream + SCRecordingOutput (macOS 15+),
# который сам кодирует H.264 в mp4 — своего кодировщика не держим.
# objc2-core-media — ради CMTime (частота кадров) и CMSampleBuffer в сигнатуре
# пустого SCStreamOutput.
objc2-screen-capture-kit = "0.3.2"
objc2-core-media = "0.3.2"
# Меню выбора источника (src/screen/macos.rs): CGImage миниатюры из
# SCScreenshotManager → JPEG через NSBitmapImageRep; имя монитора —
# NSScreen.localizedName; иконка приложения — NSRunningApplication.icon,
# отрисованная в NSBitmapImageRep 64×64 → PNG.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-graphics",
    "objc2-core-foundation",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSScreen",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSRunningApplication",
    "libc",
] }
