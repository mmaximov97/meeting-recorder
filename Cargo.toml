[package]
name = "meeting-recorder"
version = "0.1.0"
edition = "2021"

# src-tauri лежит внутри каталога корневого пакета, поэтому его надо объявить
# членом воркспейса: иначе cargo из src-tauri находит этот манифест, не видит
# себя в нём и падает с «current package believes it's in a workspace when it's
# not». Побочный плюс — общий target/ и одна сборка зависимостей на оба крейта.
[workspace]
members = ["src-tauri"]
# Без этого `cargo test` в корне прогоняет только ядро: корневой пакет — сам себе
# и член воркспейса, и его корень, а cargo по умолчанию берёт именно текущий
# пакет. Тесты GUI-крейта тогда существуют, но не запускаются никем — то есть
# ровно тот способ, которым проводка и остаётся непокрытой.
default-members = [".", "src-tauri"]

# Ядро выставлено библиотекой ради Tauri-крейта в src-tauri/: ему нужны те же
# App/WindowsDetector/poll_to_event, что и консоли.
[lib]
name = "meeting_recorder"
path = "src/lib.rs"

# Консольный бинарь остаётся и после появления GUI: это единственный способ
# прогнать ядро без webview, то есть отладить детект и запись.
[[bin]]
name = "meeting-recorder-cli"
path = "src/main.rs"

[dependencies]
sysinfo = "0.32"
thiserror = "2"
hound = "3.5"
chrono = "0.4"
# Только фасад: ядро зовёт log::error!/warn!, а какой бэкенд их слушает —
# решает потребитель (GUI — tauri-plugin-log в файл, CLI — env_logger в
# stderr). Раньше на месте этих вызовов был eprintln! прямо в захвате, и в
# GUI, у которого нет консоли, причина сбоя терялась безвозвратно.
log = "0.4"
# Бэкенд для консольного бинаря — он и так печатает в терминал, но без
# инициализации `log::error!`/`log::warn!` из ядра молча проглатываются:
# у фасада нет реализации, пока её не назначили через `env_logger::init()`.
env_logger = "0.11"
# 0.18, а не 0.15 из плана: у 0.15 другой API (россыпь отдельных типов ошибок,
# StreamConfig по ссылке, SampleRate-newtype), а loopback на WASAPI подтверждён
# прямо в исходниках 0.18 — см. комментарий в src/capture/mod.rs.
# Тянет свою версию windows (>=0.61) рядом с нашей 0.58: дубликат в дереве
# осознанный, версии semver-несовместимы и мирно сосуществуют.
cpal = "0.18"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
]
