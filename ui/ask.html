<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title data-i18n="app.windowAsk">Record this meeting?</title>
<link rel="stylesheet" href="tokens.css" />
<style>
/* Окно шире и выше плашки. Слева и снизу — поле под тень (CSS-тень обрезается
   границей окна), справа — запас, в который плашка уезжает при смахивании: без
   него она обрывалась бы на границе окна, не долетев до края экрана. Запас
   висит за краем экрана и кликов не перехватывает. */
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{
  font:13px/1.3 -apple-system,system-ui,"SF Pro Text",sans-serif;
  -webkit-user-select:none;user-select:none;cursor:default;
  -webkit-font-smoothing:antialiased;
}
#wrap{width:380px;margin-left:16px}

/* ── Плашка ────────────────────────────────────────────── */
/* Пропорции сняты с системного уведомления macOS: значок 38, скругление 18,
   заголовок 13/600, подпись 12/400. Живого размытия под окном добиться нельзя
   (backdrop-filter видит только саму страницу, а под ней прозрачное окно),
   поэтому фон плотный — на глаз он совпадает с тёмным системным материалом. */
/* Всплывашка НЕ красится акцентом приложения: это отдельное окно поверх
   чужих окон, оно читается как системное уведомление и живёт своим набором
   токенов --toast-* (ui/tokens.css) — они меняются вместе с темой системы,
   а не вместе с --accent приложения. */
#card{
  position:relative;display:flex;align-items:center;gap:11px;
  padding:12px;border-radius:18px;
  background:var(--toast-bg);
  box-shadow:var(--toast-shadow);
  color:var(--toast-fg);overflow:hidden;
  will-change:transform;
}

.ava{width:38px;height:38px;flex:none;border-radius:9px;display:grid;
  place-items:center;color:var(--toast-fg);font-weight:600;font-size:15px;
  background:var(--toast-surface)}
/* Фирменные цвета звонилок — не наши, не меняются вместе с темой. */
.ava.zoom{background:#0B5CFF}
.ava.teams{background:#6264A7}
.ava.slack{background:#4A154B}
.ava.discord{background:#5865F2}
.ava svg{display:block}

.tx{flex:1;min-width:0}
/* Трекинг зависит от кегля: крупный текст на глаз кажется разреженным, мелкий
   наоборот. Одно значение на оба было бы неверным хотя бы для одного из них. */
.tt{display:block;font-size:13px;font-weight:600;letter-spacing:-.008em;
  color:var(--toast-fg)}
.ts{display:block;font-size:12px;font-weight:400;color:var(--toast-fg-dim);
  margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Кнопка — как действие в системном уведомлении: светлое полупрозрачное
   стекло на тёмной плашке, а не цветная заливка. Цветная читалась бы как
   веб-кнопка, наклеенная поверх системного окна. */
.go{flex:none;font:inherit;font-size:13px;font-weight:600;border:none;
  border-radius:8px;background:var(--toast-surface);color:var(--toast-fg);cursor:pointer;
  padding:7px 14px;letter-spacing:-.004em;transition:background 90ms ease-out}
/* Отклик на НАЖАТИЕ, а не на отпускание: ожидание клика читается как «не
   сработало». Своего токена для нажатого состояния нет — используем тот же
   «под наведением», третьей ступени стекла в палитре не заведено. */
.go:hover{background:var(--toast-surface-hover)}
.go:active{background:var(--toast-surface-hover)}

/* Остаток времени — тонкая линия по нижнему краю плашки. */
.life{position:absolute;left:0;bottom:0;height:2px;width:0;
  background:var(--toast-life)}
#card.in .life{animation:life 7s linear forwards}
@keyframes life{from{width:100%}to{width:0}}
/* Пауза отсчёта, пока человек читает вопрос.
   Класс ставит JS по событию из Rust, а НЕ `:hover`: окно принадлежит
   неактивному приложению, а таким окнам macOS движений мыши не шлёт — `:hover`
   в нём не срабатывает никогда. Подробности — в `src-tauri/src/audio.rs`,
   `следить_за_наведением`. */
/* Селектор длиннее, чем хотелось бы, и это не украшение: сокращённая запись
   `animation` в правиле выше сама выставляет `animation-play-state: running`,
   и правило с меньшей специфичностью паузу не поставит — оно просто молча не
   сработает. */
body.наведено #card .life{animation-play-state:paused;
  background:var(--toast-life-hover)}


[hidden]{display:none !important}
</style>
</head>
<body>

<div id="wrap">
  <div id="card">
    <span class="ava" id="ava"></span>
    <span class="tx">
      <span class="tt" data-i18n="app.windowAsk">Record this meeting?</span>
      <span class="ts" id="src"></span>
    </span>
    <button class="go" id="yes" data-i18n="record.confirm">Record</button>
    <span class="life" id="life"></span>
  </div>

</div>

<script src="theme.js"></script>
<script src="i18n.js"></script>
<script src="ask.js"></script>
</body>
</html>
