<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Записи встреч</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --line: #e3e3e3;
        --accent: #2f6fed;
        /* Одинаков в обеих темах: оранжевый читается и на белом, и на тёмном,
           а второе объявление в dark-блоке только создало бы место, где эти
           два значения однажды разъедутся. */
        --warn: #d0761a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #eaeaea;
          --muted: #9a9a9a;
          --line: #333;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .lamp {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #888;
        flex: none;
      }
      .lamp.armed {
        background: #e6aa1e;
      }
      .lamp.recording {
        background: #dc3232;
      }
      /* Вопрос — не тост: кнопок в системном тосте на Windows нет, отвечают здесь. */
      #ask {
        display: none;
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      #ask.on {
        display: block;
      }
      #ask p {
        margin: 0 0 10px;
      }
      #devwarn {
        display: none;
        border: 1px solid var(--warn);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 12px;
        color: var(--warn);
      }
      #devwarn.on {
        display: block;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      select {
        font: inherit;
        flex: 1;
        /* Без этого флекс-элемент не сжимается ниже своего содержимого: самое
           длинное имя устройства («Microphone Array (Intel® Smart Sound
           Technology (Intel® SST))») распирало строку, кнопка «Проверить»
           уезжала за край окна, а внизу появлялась горизонтальная прокрутка.
           Тот же приём уже стоит на `.grow` в списке записей. */
        min-width: 0;
        padding: 7px 8px;
        border-radius: 6px;
        border: 1px solid var(--line);
        /* Не `transparent`: при прозрачном фоне нативный попап рисует себя
           светлым, а буквы остаются цвета --fg — в тёмной теме почти белого.
           Невыбранные пункты в таком попапе не видно. */
        background: var(--bg);
        color: var(--fg);
      }
      /* Попап рисует браузер, а не страница, и наследование цвета доходит в
         него непоследовательно между версиями WebView2 — красим явно. */
      option {
        background: var(--bg);
        color: var(--fg);
      }
      /* Не предупреждение и не ошибка: приложение делает ровно то, что должно.
         Поэтому приглушённым цветом, а не --warn — это объяснение, а не тревога. */
      #mic-deferred {
        display: none;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      #mic-deferred.on {
        display: block;
      }
      .meters {
        margin-top: 8px;
      }
      .meter {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .meter span {
        width: 56px;
        flex: none;
      }
      .bar {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.12s linear;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 18px 0 8px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      li > .grow {
        flex: 1;
        min-width: 0;
      }
      /* Кнопка есть в каждой строке, поэтому по умолчанию она молчит: шесть
         одинаковых акцентных прямоугольников перетягивали внимание с самих
         записей. Прятать её до наведения нельзя — потеряется доступ с
         клавиатуры, поэтому она остаётся на месте, но проявляется по фокусу. */
      .rename {
        padding: 4px 8px;
        font-size: 12px;
        border-color: transparent;
        color: var(--muted);
      }
      .rename:hover,
      .rename:focus-visible {
        border-color: var(--accent);
        color: var(--fg);
      }
      /* Во время правки `.name` перестаёт быть строкой текста и становится
         контейнером «неизменяемый префикс + поле ввода». Обрезка многоточием,
         которая нужна ей в обычном состоянии, здесь срезала бы само поле:
         оно шириной во весь контейнер и не помещается рядом с префиксом.
         Выглядит это как исчезнувшее место ввода — правку негде набрать. */
      .name.editing {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow: visible;
      }
      .name.editing .tail-input {
        flex: 1;
        min-width: 0;
        width: auto;
      }
      .tail-input {
        font: inherit;
        width: 100%;
        padding: 4px 6px;
        border-radius: 4px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--fg);
      }
      .name {
        font-variant-numeric: tabular-nums;
        /* После переименования имя задаёт человек, и длинное распёрло бы строку
           ровно так же, как это делала выпадашка. Полное имя остаётся в
           подсказке — её ставит `обновить_список`. */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .warn {
        color: var(--warn);
      }
      .empty,
      #err {
        color: var(--muted);
      }
      #err {
        color: #dc3232;
        margin-top: 10px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div class="status"><span id="lamp" class="lamp"></span><span id="state">Ожидание встречи</span></div>

    <div id="ask">
      <p id="ask-text">Похоже, встреча. Записать?</p>
      <div class="row">
        <button class="primary" id="yes">Записать</button>
        <button id="no">Нет</button>
      </div>
    </div>

    <div id="devwarn"></div>

    <h2>Микрофон</h2>
    <div class="row">
      <select id="mic"></select>
      <button id="check">Проверить</button>
    </div>
    <div id="mic-deferred">Применится к следующей записи — текущая пишется прежним микрофоном.</div>
    <div class="meters">
      <div class="meter"><span>Вы</span><div class="bar"><i id="lvl-mic"></i></div></div>
      <div class="meter"><span>Система</span><div class="bar"><i id="lvl-sys"></i></div></div>
    </div>

    <div class="row">
      <button id="toggle">Начать запись</button>
      <button id="folder">Открыть папку</button>
    </div>

    <h2>Записи</h2>
    <ul id="list"></ul>
    <div id="err"></div>

    <script src="main.js"></script>
  </body>
</html>
