<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Записи встреч</title>
    <style>
      /* Палитра Tokyo Night — та же, что в терминале владельца.
         Схема перенесена НЕ дословно: два её штатных сочетания не проходят по
         контрасту, а это приложение на таком уже обжигалось (невидимые пункты
         выпадашки). Заменены ровно два места, обоснование — в
         docs/2026-08-03-tokyo-night-palette-design.md. */
      :root {
        /* Не `light dark`: без явного `dark` движок рисует нативный попап
           выпадашки светлым, и тёмные пункты в нём пропадают. */
        color-scheme: dark;
        --bg: #1a1b26;
        --fg: #c0caf5;
        /* Не комментарный #565f89 из схемы: он даёт 2.76:1 на этом фоне, а это
           цвет мета-строки — размеры, децибелы, пометка перекоса. Здесь 4.54:1. */
        --muted: #7982a9;
        --line: #292e42;
        --accent: #7aa2f7;
        --warn: #e0af68;
        --error: #f7768e;
        /* Зелёная зона метра уровня. Своей переменной раньше не было — жёлтый
           и красный уже есть (--warn, --error) и совпадают по смыслу с зонами
           «внимание»/«клиппинг», а зелёного («норма») в схеме не было вообще. */
        --good: #9ece6a;
        /* Текст на акцентной кнопке. Белым по этому синему — 2.52:1, то есть
           нечитаемая кнопка «Записать»; цветом фона схемы — 6.79:1. */
        --on-accent: #1a1b26;
        /* Шрифт терминала. Запасные не для красоты: 0xProto установлен для
           пользователя, а не системно, и если DirectWrite его не отдаст, окно
           должно остаться читаемым, а не поехать. */
        --mono: "0xProto Nerd Font Mono", "Cascadia Mono", Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .lamp {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        /* Покой — это и есть приглушённое состояние, поэтому тот же цвет, что у
           второстепенного текста. Не #414868 из схемы: 1.91:1, лампочка на таком
           фоне попросту не видна, а она несёт состояние. */
        background: var(--muted);
        flex: none;
      }
      .lamp.armed {
        background: var(--warn);
      }
      .lamp.recording {
        background: var(--error);
      }
      /* Вопрос — не тост: кнопок в системном тосте на Windows нет, отвечают здесь. */
      #ask {
        display: none;
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      #ask.on {
        display: block;
      }
      #ask p {
        margin: 0 0 10px;
      }
      #devwarn {
        display: none;
        border: 1px solid var(--warn);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 12px;
        color: var(--warn);
      }
      #devwarn.on {
        display: block;
      }
      /* Тот же вид, что у #devwarn: оба — «работает, но не полностью».
         Баннер висит до перезапуска, поэтому в нём ровно два факта и кнопка:
         длинный текст его не объясняет, а прячет — читают такое один раз, а
         видят каждый день. Подробности (техническая причина отказа) живут в
         title, то есть доступны и не мозолят глаза. */
      #nosysaudio {
        display: none;
        border: 1px solid var(--warn);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 12px;
        color: var(--warn);
      }
      #nosysaudio.on {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #nosysaudio span {
        flex: 1;
      }
      /* Кнопка не должна ужиматься до многоточия, когда текст длинный. */
      #nosysaudio button {
        flex: none;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      select,
      input[type="text"],
      input[type="password"] {
        font: inherit;
        /* Имена устройств — данные, а не речь. */
        font-family: var(--mono);
        flex: 1;
        /* Без этого флекс-элемент не сжимается ниже своего содержимого: самое
           длинное имя устройства («Microphone Array (Intel® Smart Sound
           Technology (Intel® SST))») распирало строку, кнопка «Проверить»
           уезжала за край окна, а внизу появлялась горизонтальная прокрутка.
           Тот же приём уже стоит на `.grow` в списке записей. */
        min-width: 0;
        padding: 7px 8px;
        border-radius: 6px;
        border: 1px solid var(--line);
        /* Не `transparent`: при прозрачном фоне нативный попап рисует себя
           светлым, а буквы остаются цвета --fg — в тёмной теме почти белого.
           Невыбранные пункты в таком попапе не видно. */
        background: var(--bg);
        color: var(--fg);
      }
      /* Попап рисует браузер, а не страница, и наследование цвета доходит в
         него непоследовательно между версиями WebView2 — красим явно. */
      option {
        background: var(--bg);
        color: var(--fg);
        /* Шрифт задаётся явно по той же причине, что и цвета: попап рисует
           движок, и наследование от `select` доходит в него ненадёжно. */
        font-family: var(--mono);
      }
      /* Не предупреждение и не ошибка: приложение делает ровно то, что должно.
         Поэтому приглушённым цветом, а не --warn — это объяснение, а не тревога. */
      #mic-deferred {
        display: none;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      #mic-deferred.on {
        display: block;
      }
      .meters {
        margin-top: 8px;
      }
      .meter {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .meter span {
        width: 56px;
        flex: none;
      }
      .bar {
        position: relative;
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      /* Заливка — не перекрашивающийся кусок переменной ширины, а фиксированный
         по позиции градиент (зелёный до -18 дБ, жёлтый до -6, дальше красный),
         обрезаемый clip-path'ом справа. Если бы вместо этого менялась ширина
         самого градиентного элемента, цвет в моменте зависел бы от текущей
         громкости, а не от абсолютного дБ — тихая речь и клиппинг красились бы
         в один и тот же зелёный на самом краю полоски. */
      .bar > i {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          var(--good) 0%,
          var(--good) 70%,
          var(--warn) 70%,
          var(--warn) 90%,
          var(--error) 90%,
          var(--error) 100%
        );
        clip-path: inset(0 calc(100% - var(--level, 0%)) 0 0);
        transition: clip-path 0.12s linear;
      }
      /* Пиковый маркер: держит недавний максимум и сползает к текущему уровню
         (см. применить_пик в main.js). Невидим, пока сигнала не было ни разу —
         иначе на пустом метре торчала бы линия у нулевой отметки с самого
         старта приложения. */
      .bar > b {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        left: var(--peak, 0%);
        background: var(--fg);
        opacity: 0;
        transition: left 0.15s linear;
      }
      .bar > b.on {
        opacity: 1;
      }
      .dbval {
        width: 52px;
        flex: none;
        text-align: right;
        /* Число дБ — данные, как и децибелы перекоса в .meta. */
        font-family: var(--mono);
      }
      /* Общая шкала на обе полоски: диапазон один и тот же (-60..0 дБ, см.
         МЕТР_ПОЛ_ДБ в main.js), дублировать деления под каждым каналом было бы
         одной и той же строкой дважды. Отступы подгоняют деления под полосу:
         слева ширина подписи канала + gap (56+8), справа — ширина .dbval + gap
         (52+8). */
      .scale {
        position: relative;
        height: 12px;
        margin: 2px 60px 0 64px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
      }
      .scale span {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
      }
      .scale span:first-child {
        transform: none;
      }
      .scale span:last-child {
        transform: translateX(-100%);
      }
      h2 {
        font-family: var(--mono);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 18px 0 8px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      li > .grow {
        flex: 1;
        min-width: 0;
      }
      /* Кнопка есть в каждой строке, поэтому по умолчанию она молчит: шесть
         одинаковых акцентных прямоугольников перетягивали внимание с самих
         записей. Прятать её до наведения нельзя — потеряется доступ с
         клавиатуры, поэтому она остаётся на месте, но проявляется по фокусу. */
      .rename {
        padding: 4px 8px;
        font-size: 12px;
        border-color: transparent;
        color: var(--muted);
      }
      .rename:hover,
      .rename:focus-visible {
        border-color: var(--accent);
        color: var(--fg);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* Во время правки `.name` перестаёт быть строкой текста и становится
         контейнером «неизменяемый префикс + поле ввода». Обрезка многоточием,
         которая нужна ей в обычном состоянии, здесь срезала бы само поле:
         оно шириной во весь контейнер и не помещается рядом с префиксом.
         Выглядит это как исчезнувшее место ввода — правку негде набрать. */
      .name.editing {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow: visible;
      }
      .name.editing .tail-input {
        flex: 1;
        min-width: 0;
        width: auto;
      }
      .tail-input {
        font: inherit;
        /* Обязательно тот же, что у `.name`: при правке неизменяемый префикс и
           редактируемый хвост стоят в одной строке, и разными шрифтами это
           выглядит поломкой вёрстки. */
        font-family: var(--mono);
        font-variant-ligatures: none;
        width: 100%;
        padding: 4px 6px;
        border-radius: 4px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--fg);
      }
      .name {
        font-family: var(--mono);
        /* 0xProto склеивает последовательности вроде `->` и `==`. В имени файла
           человек ждёт ровно те символы, что лежат на диске, а не глиф вместо
           двух — лигатуры здесь вредны. */
        font-variant-ligatures: none;
        font-variant-numeric: tabular-nums;
        /* После переименования имя задаёт человек, и длинное распёрло бы строку
           ровно так же, как это делала выпадашка. Полное имя остаётся в
           подсказке — её ставит `обновить_список`. */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        font-family: var(--mono);
        font-variant-ligatures: none;
        color: var(--muted);
        font-size: 12px;
      }
      .warn {
        color: var(--warn);
      }
      .empty,
      #err {
        color: var(--muted);
      }
      #err {
        color: var(--error);
        margin-top: 10px;
        min-height: 1em;
      }
      .footer {
        margin-top: 16px;
        text-align: center;
      }
      /* Кнопка, а не <a href>: обычная ссылка в вебвью Tauri открылась бы
         внутри самого окна вместо системного браузера. button.link дёргает
         open_repository, который открывает URL тем же способом, что и
         open_folder — путь. */
      button.link {
        border: none;
        background: none;
        padding: 0;
        font-size: 11px;
        color: var(--muted);
      }
      button.link:hover {
        color: var(--accent);
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="status"><span id="lamp" class="lamp"></span><span id="state">Ожидание встречи</span></div>

    <div id="ask">
      <p id="ask-text">Похоже, встреча. Записать?</p>
      <div class="row">
        <button class="primary" id="yes">Записать</button>
        <button id="no">Нет</button>
      </div>
    </div>

    <div id="devwarn"></div>
    <div id="nosysaudio">
      <span id="nosysaudio-text"></span>
      <button id="nosysaudio-fix">Настройки</button>
    </div>

    <h2>Микрофон</h2>
    <div class="row">
      <select id="mic"></select>
      <button id="check">Проверить</button>
    </div>
    <div id="mic-deferred">Применится к следующей записи — текущая пишется прежним микрофоном.</div>
    <div class="meters">
      <div class="meter">
        <span>Вы</span>
        <div class="bar"><i id="lvl-mic"></i><b id="peak-mic"></b></div>
        <span id="db-mic" class="dbval">-∞ дБ</span>
      </div>
      <div class="meter">
        <span>Система</span>
        <div class="bar"><i id="lvl-sys"></i><b id="peak-sys"></b></div>
        <span id="db-sys" class="dbval">-∞ дБ</span>
      </div>
      <div class="scale">
        <span style="left: 0%">-60</span>
        <span style="left: 16.67%">-50</span>
        <span style="left: 33.33%">-40</span>
        <span style="left: 50%">-30</span>
        <span style="left: 60%">-24</span>
        <span style="left: 70%">-18</span>
        <span style="left: 80%">-12</span>
        <span style="left: 90%">-6</span>
        <span style="left: 100%">0</span>
      </div>
    </div>

    <div class="row">
      <button id="toggle">Начать запись</button>
      <button id="folder">Открыть папку</button>
    </div>

    <h2>Транскрипция</h2>
    <div class="row">
      <input type="text" id="stt-url" placeholder="URL шлюза, например http://localhost:8080" />
    </div>
    <div class="row">
      <input type="password" id="stt-key" placeholder="Ключ" />
    </div>

    <h2>Записи</h2>
    <ul id="list"></ul>
    <div id="err"></div>

    <div class="footer">
      <button id="repo-link" class="link">github.com/mmaximov97/meeting-recorder</button>
    </div>

    <script src="main.js"></script>
  </body>
</html>
